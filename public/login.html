<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · bloodstain-c5531</title>
  <style>
    :root {
      --bg: #0b1120; --card: #131c31; --border: #24314d; --text: #e5edff;
      --muted: #93a4c6; --accent: #2563eb; --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #16233f 0%, var(--bg) 60%);
    }
    .card {
      width: min(400px, 100%); background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 30px; box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    h1 { margin: 0 0 4px; font-size: 1.35rem; }
    p.sub { margin: 0 0 22px; color: var(--muted); font-size: .9rem; }
    label { display: block; margin: 14px 0 6px; font-size: .8rem; color: var(--muted); }
    input {
      width: 100%; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--border);
      background: #0e1728; color: var(--text); font-size: .95rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    button {
      flex: 1; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--border);
      font-size: .92rem; font-weight: 600; cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.ghost { background: transparent; color: var(--text); }
    button:disabled { opacity: .55; cursor: default; }
    .msg { margin-top: 16px; min-height: 1.1em; font-size: .85rem; color: var(--err); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <p class="sub">bloodstain-c5531</p>

    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required minlength="6">

      <div class="actions">
        <button class="primary" id="signIn" type="submit">Sign in</button>
        <button class="ghost" id="signUp" type="button">Create account</button>
      </div>
    </form>

    <p class="msg" id="msg"></p>
  </main>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const msg = document.getElementById("msg");
    const signInBtn = document.getElementById("signIn");
    const signUpBtn = document.getElementById("signUp");

    // Already signed in? Go straight to the app.
    onAuthStateChanged(auth, (user) => {
      if (user) location.replace("./index.html");
    });

    function setBusy(busy) {
      signInBtn.disabled = busy;
      signUpBtn.disabled = busy;
    }

    async function run(fn) {
      msg.textContent = "";
      if (!email.value || !password.value) {
        msg.textContent = "Enter an email and password.";
        return;
      }
      setBusy(true);
      try {
        await fn(auth, email.value.trim(), password.value);
        location.replace("./index.html");
      } catch (err) {
        msg.textContent = friendly(err?.code) || err?.message || "Something went wrong.";
      } finally {
        setBusy(false);
      }
    }

    function friendly(code) {
      switch (code) {
        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found":
          return "Incorrect email or password.";
        case "auth/email-already-in-use":
          return "That email already has an account — try signing in.";
        case "auth/weak-password":
          return "Password must be at least 6 characters.";
        case "auth/invalid-email":
          return "That doesn't look like a valid email.";
        default:
          return null;
      }
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      run(signInWithEmailAndPassword);
    });
    signUpBtn.addEventListener("click", () => run(createUserWithEmailAndPassword));
  </script>
</body>
</html>
